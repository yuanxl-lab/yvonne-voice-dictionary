<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yvonne's Voice Dictionary</title>
<meta name="description" content="A bilingual voice dictionary for English vocabulary learning">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header__logo">📖🔊</div>
    <h1 class="header__title">Yvonne's Voice Dictionary</h1>
    <p class="header__subtitle">Your Voice-Powered English World</p>
  </header>

  <nav class="nav-tabs">
    <button class="nav-tab active" data-mode="search" id="tab-search">🔍 Search</button>
    <button class="nav-tab" data-mode="browse" id="tab-browse">📚 Browse</button>
    <button class="nav-tab" data-mode="stories" id="tab-stories">📖 Stories</button>
  </nav>

  <div class="search-section" id="search-section">
    <div class="search-box">
      <span class="search-box__icon">🔍</span>
      <input type="text" class="search-box__input" id="search-input"
             placeholder="Type a word... 输入单词" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button class="search-box__clear" id="search-clear">✕</button>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <div class="filter-group" id="filter-grades"></div>
    <div class="filter-group" id="filter-categories"></div>
  </div>

  <main id="results"></main>

  <div class="stories-section" id="stories-section" style="display: none;"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <button class="modal-close" id="modal-close">✕</button>
  <div class="modal-content" id="modal-content"></div>
</div>

<div class="passcode-screen" id="passcode-screen" style="display: none;">
  <div class="passcode-container">
    <div class="passcode-logo">📖🔒</div>
    <h2 class="passcode-title">Yvonne's Dictionary</h2>
    <p class="passcode-subtitle">Enter Passcode to Unlock</p>
    <div class="passcode-dots">
      <div class="passcode-dot"></div>
      <div class="passcode-dot"></div>
      <div class="passcode-dot"></div>
      <div class="passcode-dot"></div>
      <div class="passcode-dot"></div>
      <div class="passcode-dot"></div>
    </div>
    <div class="passcode-keypad">
      <button class="passcode-key" data-val="1">1</button>
      <button class="passcode-key" data-val="2">2</button>
      <button class="passcode-key" data-val="3">3</button>
      <button class="passcode-key" data-val="4">4</button>
      <button class="passcode-key" data-val="5">5</button>
      <button class="passcode-key" data-val="6">6</button>
      <button class="passcode-key" data-val="7">7</button>
      <button class="passcode-key" data-val="8">8</button>
      <button class="passcode-key" data-val="9">9</button>
      <button class="passcode-key empty"></button>
      <button class="passcode-key" data-val="0">0</button>
      <button class="passcode-key delete" data-val="delete">⌫</button>
    </div>
    <div class="passcode-error" id="passcode-error">Incorrect passcode. Try again.</div>
  </div>
</div>

<script>
  // Sync check to prevent lock screen flashing if already authenticated
  if (localStorage.getItem('vd_unlocked') === 'true') {
    document.getElementById('passcode-screen').style.display = 'none';
  } else {
    document.getElementById('passcode-screen').style.display = 'flex';
  }
</script>

<script src="data/vocabulary.js"></script>
<script src="data/stories.js"></script>
<script src="js/speech.js"></script>
<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/stories.js"></script>
<script src="js/app.js"></script>
</body>
</html>
